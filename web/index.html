<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Browsers that ignore the SVG icon fall back to requesting /favicon.ico;
         pointing that at the SVG too avoids a 404 on every page load. -->
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="description"
      content="Connect4.gg — play ranked Connect 4 online. ELO ratings, skill-based matchmaking, multiple time controls, and bots to train against."
    />
    <title>Connect4.gg — Competitive Connect 4</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applies the saved theme's ground colour before React mounts, so
      // switching to a light theme does not flash the dark default on every
      // load. The full token set is written by the app a moment later.
      (function () {
        try {
          var id = localStorage.getItem('c4-theme');
          var grounds = {
            midnight: ['2 6 23', 'dark', '241 245 249'],
            lab: ['242 241 238', 'light', '17 17 17'],
            coquice: ['234 241 238', 'light', '16 40 34'],
            formix: ['13 7 5', 'dark', '255 246 240'],
            ruined: ['8 20 19', 'dark', '234 228 212'],
          };
          var chosen = grounds[id];
          if (chosen) {
            var root = document.documentElement;
            root.style.setProperty('--c-bg', chosen[0]);
            root.style.setProperty('--c-ink', chosen[2]);
            root.style.setProperty('color-scheme', chosen[1]);
            root.dataset.theme = id;
          }
        } catch (e) {
          /* Storage unavailable: the default theme is correct. */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
